<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片检查器 · 真实 DSL</title>
<style>
:root{--bg:#F6F7F9;--panel:#FFFFFF;--line:#E4E7EC;--text:#1B2130;--muted:#68707D;--faint:#8A929E;--blue:#185FA5;--blue-soft:#E8F2FB;--blue-line:#B7D5EF;--code:#F5F6F8;--ok:#1D7A4D;--warn:#9A6208;--bad:#A32D2D;--ok-bg:#EAF5EF;--warn-bg:#FFF6E6;--bad-bg:#FBECEC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.58 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,select,input,textarea{font:inherit}
button{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--text)}
button:hover{border-color:var(--blue);color:var(--blue)}
button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
button:disabled{opacity:.4;cursor:default}
select{font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);max-width:340px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:14px;font-weight:600;letter-spacing:.2px}
.brand em{font-style:normal;font-size:11px;color:var(--faint);font-weight:400;margin-left:6px}
.spacer{flex:1}
.sep{width:1px;height:18px;background:var(--line)}
.zoombox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoombox input[type=range]{width:88px;accent-color:var(--blue)}
.runbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#FBFCFD}
.sample-info{font-size:12px;color:#0C447C;line-height:1.65;flex:1;min-width:240px}
.sample-info b{font-weight:600}
.sample-info .muted{color:var(--muted)}
#paste-panel{display:none;padding:10px 14px;background:#FBFCFD;border-bottom:1px solid var(--line)}
#paste-panel textarea{width:100%;height:100px;font:12px/1.5 ui-monospace,Consolas,monospace;padding:8px;border:1px solid var(--line);border-radius:7px;resize:vertical}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr) minmax(0,360px);gap:12px;padding:12px 14px 8px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:11px;min-width:0;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.pane-head .tagline{font-weight:400;color:var(--faint);font-size:11px}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:16px 10px;min-height:300px;overflow:auto;background:repeating-conic-gradient(#FAFBFC 0% 25%,#F3F5F7 0% 50%) 50%/16px 16px}
.viewport{position:relative;flex:none;width:240px;height:240px;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(20,30,50,.06);border-radius:16px;overflow:hidden;transform-origin:top center}
.node{box-sizing:border-box;min-width:0;min-height:0}
/* 与 card_renderer/runtime ExtendedStack 对齐：容器 relative，每个 child 一个绝对定位 wrapper */
.node-Stack{position:relative;display:block}
.stack-slot{position:absolute;inset:0;display:flex;pointer-events:none;min-width:0;min-height:0}
.stack-slot>*{pointer-events:auto;flex-shrink:0}
.node-Column{display:flex;flex-direction:column;align-items:stretch}
.node-Row{display:flex;flex-direction:row;align-items:center}
.node-Text{overflow:hidden;white-space:pre-wrap;word-break:break-word}
.node-Image{display:block;background-color:#3A4A70;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 6px,transparent 6px 13px);overflow:hidden}
.node-Image.img-ready{background-image:none}
.node-Image.icon{background-image:none}
.node-Image .img-src{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.node-Button{display:flex;align-items:center;justify-content:center;text-align:center}
.node-Progress{display:block;background:rgba(255,255,255,.22)}
.node-Divider{display:block}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:9}
.hl{position:absolute;border:1px solid #185FA5;background:rgba(24,95,165,.14);box-sizing:border-box}
.hl.hover{border-style:dashed;background:rgba(24,95,165,.06)}
.ruler{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #185FA5;border-radius:4px;padding:0 5px;font-size:10px;line-height:1.6;color:#0C447C;white-space:nowrap}
.stage-foot{padding:8px 12px;border-top:1px dashed var(--line);font-size:11px;color:var(--faint);line-height:1.6}
#editor{padding:4px 12px 12px;max-height:calc(100vh - 190px);overflow:auto}
.empty{font-size:12px;color:var(--muted);line-height:1.85;padding:10px 0}
.verdict{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:12px;margin:8px 0 4px;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.rule{display:flex;gap:7px;align-items:flex-start;padding:4px 0;font-size:12px;line-height:1.6;border-bottom:1px solid #F1F3F6}
.rule:last-child{border-bottom:0}
.dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.rule b{font-weight:600;flex:none}
.rule span{color:var(--muted);word-break:break-word}
details{border-top:1px solid var(--line);padding:7px 0 3px}
details>summary{cursor:pointer;font-size:12px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;padding:2px 0}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"";width:0;height:0;border-left:4px solid var(--faint);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .12s}
details[open]>summary:before{transform:rotate(90deg)}
details>summary .count{font-weight:400;color:var(--faint);font-size:11px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:6px 0}
.metric{background:var(--code);border-radius:7px;padding:5px 7px}
.metric span{display:block;font-size:10px;color:var(--muted)}
.metric b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #F1F3F6;font-size:12px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted);flex:none}
.kv>span:last-child{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.crumb{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:4px 0 2px}
.crumb button{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--code);border-color:transparent;color:var(--muted)}
.crumb button:hover{background:var(--blue-soft);color:var(--blue)}
.crumb i{color:var(--faint);font-style:normal;font-size:10px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--muted);background:#fff;margin-left:4px;vertical-align:1px}
.badge.theme{color:#6B4E12;background:#FFF6E6;border-color:#F0DCAE}
.badge.dyn{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-line)}
.badge.static{color:var(--ok);background:var(--ok-bg);border-color:#C9E6D6}
.note{background:var(--warn-bg);border:1px solid #F0DCAE;border-radius:7px;padding:7px 9px;font-size:12px;line-height:1.65;color:#6B4E12;margin:8px 0 2px}
.frow{display:grid;grid-template-columns:minmax(0,44%) minmax(0,56%);gap:6px;align-items:center;padding:2px 0}
.frow label{font-size:11px;color:var(--muted);word-break:break-all}
.ctl{display:flex;align-items:center;gap:5px;min-width:0}
input[type=text],input[type=number]{width:100%;min-width:0;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
input[type=checkbox]{accent-color:var(--blue)}
.sw{flex:none;width:13px;height:13px;border-radius:4px;border:1px solid var(--line)}
.chain{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:7px;padding:7px 9px;font-size:12px;line-height:1.7;color:#0C447C;margin-top:8px}
.chain div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsl-box{padding:10px 12px}
.tabs{display:flex;gap:4px;margin-left:auto}
pre{margin:0;background:var(--code);border-radius:8px;padding:9px;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:calc(100vh - 250px);overflow:auto}
pre mark{background:#FFE9A8;color:#4A3A00;border-radius:2px;padding:0 1px}
.diff{font-size:12px;max-height:calc(100vh - 250px);overflow:auto}
.diff div{padding:4px 0;border-bottom:1px solid #F1F3F6;word-break:break-all;line-height:1.65}
.diff b{font-weight:600;color:var(--blue)}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:7px 14px 12px;font-size:11px;color:var(--faint)}
.statusbar b{font-weight:500;color:var(--muted)}
@media(max-width:1120px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">卡片检查器<em>真实 A2UI DSL</em></div>
<select id="sample-select"></select>
<button id="pick-file">本地文件</button>
<input type="file" id="file-input" accept=".jsonl,.json" hidden>
<button id="paste-toggle">粘贴</button>
<button id="toggle-base" class="on">底图：真实素材</button>
<div class="spacer"></div>
<button data-vp="240x240" class="on">2×2</button>
<button data-vp="240x480">2×4</button>
<span class="sep"></span>
<div class="zoombox"><span>缩放</span><input type="range" id="zoom" min="50" max="150" step="25" value="100"><span id="zoom-val">100%</span></div>
<span class="sep"></span>
<button id="undo" disabled>撤销</button>
<button id="redo" disabled>重做</button>
<button id="reset">重置</button>
<button id="export">导出 jsonl</button>
</header>

<div id="paste-panel">
<textarea id="paste-text" placeholder="粘贴 .jsonl 内容：一个 JSON 数组，包含 createSurface / updateComponents / updateDataModel"></textarea>
<div style="margin-top:6px;display:flex;gap:6px;align-items:center"><button id="paste-apply">加载</button><button id="paste-cancel">取消</button><span id="paste-error" style="font-size:12px;color:#A32D2D"></span></div>
</div>

<div class="runbar">
<div class="sample-info" id="sample-info"></div>
</div>

<main class="grid">
<section class="pane">
<div class="pane-head">预览<span class="tagline" id="sel-label">未选中</span></div>
<div class="stage"><div class="viewport" id="viewport"><div id="overlay"></div></div></div>
<div class="stage-foot" id="basis">开发态显式测试视口 · CSS px · Alt+点击可逐层选中被遮挡的背景层 · Web 预览不等于真机避让通过</div>
</section>

<section class="pane">
<div class="pane-head">检查器<span class="tagline">点击卡片区域查看</span></div>
<div id="editor"><div class="empty">点击左侧卡片任意区域。<br>面板会先给结论，再给几何、来源与绑定；改字段会同步写回 DSL。</div></div>
</section>

<section class="pane">
<div class="pane-head">DSL
<span class="tabs"><button data-tab="dsl" class="on">格式化</button><button data-tab="diff">变更</button></span>
</div>
<div class="dsl-box">
<div id="tab-dsl"><pre id="dsl-text"></pre></div>
<div id="tab-diff" style="display:none"><div class="diff" id="diff-text"></div></div>
</div>
</section>
</main>

<footer class="statusbar">
<span><b>选中</b> <span id="st-node">-</span></span>
<span><b>缩放</b> <span id="st-zoom">100%</span></span>
<span><b>修改</b> <span id="st-diff">0</span></span>
<span><b>底图</b> <span id="st-base">真实素材</span></span>
<span><b>口径</b> 显式测试视口，不代表端侧真机</span>
<span><b>数据源</b> golden_result/A2UI_DSL（只读）</span>
</footer>

if(!arr.some(function(m){return m&&m.updateComponents}))throw new Error('缺少 updateComponents 消息');
if(!arr.some(function(m){return m&&m.updateDataModel}))arr.push({version:'v0.9',updateDataModel:{surfaceId:'surface_card',path:'/',value:{}}});
return arr;
}
function stats(){
var cs=comps(),weight=0,pct=0,match=0;
cs.forEach(function(c){var st=c.styles||{};if('layoutWeight' in st)weight++;['width','height'].forEach(function(k){var v=st[k];if(v==='matchParent')match++;else if(typeof v==='string'&&v.indexOf('%')>=0)pct++})});
return {comps:cs.length,weight:weight,pct:pct,match:match};
}
function renderInfo(){
var st=stats(),m=S.meta||{};
document.getElementById('sample-info').innerHTML='<b>'+esc(S.name)+'</b> · 需求：'+esc(m.query||'本地文件')+' · 规格 '+esc(m.size||'2x2')+
'<br><span class="muted">组件 '+st.comps+' 个 · matchParent '+st.match+' 处 · layoutWeight '+st.weight+' 处 · 百分比尺寸 '+st.pct+' 处 · 全库无 x/y 坐标</span>';
}
function loadDoc(name,doc,meta){
var normalized;
try{normalized=normalizeDoc(doc)}catch(err){document.getElementById('paste-error').textContent=err.message;return false}
S.name=name;S.meta=meta||{};
S.original=clone(normalized);S.doc=clone(normalized);
S.history=[];S.future=[];S.diffs=[];
var texts=comps().filter(function(c){return c.component==='Text'});
var preferred=texts.filter(function(c){return c.styles&&c.styles.fontSize>=16})[0]||texts[0];
S.selected=preferred?preferred.id:rootId();
S.vp={w:240,h:S.meta.size==='2x4'?480:240};
viewport.style.width=S.vp.w+'px';viewport.style.height=S.vp.h+'px';
basis.textContent='开发态显式测试视口 '+S.vp.w+'×'+S.vp.h+' · CSS px · Alt+点击逐层穿透 · Web 预览不等于真机避让通过';
document.querySelectorAll('[data-vp]').forEach(function(x){x.classList.toggle('on',x.dataset.vp===S.vp.w+'x'+S.vp.h)});
document.getElementById('paste-error').textContent='';
renderInfo();renderAll();return true;
}

var sel=document.getElementById('sample-select');
sel.innerHTML=SAMPLES.map(function(s,i){return '<option value="'+i+'">'+esc(s.name)+' · '+esc(s.query)+' · '+esc(s.size)+'</option>'}).join('');
sel.addEventListener('change',function(){var s=SAMPLES[+sel.value];if(s)loadDoc(s.name,s.doc,s)});
document.getElementById('pick-file').addEventListener('click',function(){document.getElementById('file-input').click()});
document.getElementById('file-input').addEventListener('change',function(e){
var f=e.target.files&&e.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){
try{loadDoc(f.name.replace(/\.(jsonl|json)$/i,''),JSON.parse(String(r.result)),{query:'本地文件',size:'2x2'})}
catch(err){document.getElementById('paste-error').textContent='解析失败：'+err.message}
};
r.readAsText(f);e.target.value='';
});
var pp=document.getElementById('paste-panel');
document.getElementById('paste-toggle').addEventListener('click',function(){pp.style.display=pp.style.display==='none'?'':'none'});
document.getElementById('paste-cancel').addEventListener('click',function(){pp.style.display='none'});
document.getElementById('paste-apply').addEventListener('click',function(){
try{if(loadDoc('粘贴样本',JSON.parse(document.getElementById('paste-text').value),{query:'粘贴内容',size:'2x2'}))pp.style.display='none'}
catch(err){document.getElementById('paste-error').textContent='解析失败：'+err.message}
});

viewport.style.transform='scale(1)';
loadDoc(SAMPLES[0].name,SAMPLES[0].doc,SAMPLES[0]);
})();
</script>
</body>
</html>
